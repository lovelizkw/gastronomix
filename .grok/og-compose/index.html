<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Fraunces";
        font-style: normal;
        font-weight: 600;
        src: url("./Fraunces-600.ttf") format("truetype");
      }
      @font-face {
        font-family: "Fraunces";
        font-style: italic;
        font-weight: 400;
        src: url("./Fraunces-Italic.ttf") format("truetype");
      }
      @font-face {
        font-family: "Libre Baskerville";
        font-style: normal;
        font-weight: 400;
        src: url("./LibreBaskerville-Regular.ttf") format("truetype");
      }
      @font-face {
        font-family: "Libre Baskerville";
        font-style: italic;
        font-weight: 400;
        src: url("./LibreBaskerville-Italic.ttf") format("truetype");
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #1c1917;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
      }
      .photo {
        position: absolute;
        inset: 0;
        width: 1200px;
        height: 630px;
        object-fit: cover;
        object-position: center 46%;
      }
      .vignette {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 62% 58% at 50% 50%,
            rgba(247, 242, 234, 0.9) 0%,
            rgba(247, 242, 234, 0.62) 38%,
            rgba(247, 242, 234, 0.12) 68%,
            rgba(28, 25, 23, 0.28) 100%
          );
      }
      .frame {
        position: absolute;
        inset: 22px;
        border: 1px solid rgba(247, 242, 234, 0.38);
        pointer-events: none;
      }
      .lockup {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 760px;
        text-align: center;
        color: #1c1917;
      }
      .kicker {
        font-family: "Libre Baskerville", serif;
        font-size: 13px;
        letter-spacing: 0.46em;
        text-transform: uppercase;
        color: #5d7348;
        margin-bottom: 18px;
      }
      .rule {
        width: 88px;
        height: 1.5px;
        margin: 0 auto;
        background: #9cba7a;
      }
      .rule-blush {
        width: 36px;
        height: 1.5px;
        margin: 7px auto 0;
        background: #f4c9c4;
      }
      h1 {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 88px;
        line-height: 0.92;
        letter-spacing: -0.028em;
        color: #1c1917;
        margin: 18px 0 14px;
        font-optical-sizing: auto;
      }
      .tag {
        font-family: "Fraunces", serif;
        font-style: italic;
        font-weight: 400;
        font-size: 22px;
        letter-spacing: 0.04em;
        color: #1c1917;
        margin-bottom: 18px;
      }
      .issue {
        font-family: "Libre Baskerville", serif;
        font-size: 11px;
        letter-spacing: 0.38em;
        text-transform: uppercase;
        color: #7a6f9a;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="photo" src="./hero.jpg" alt="" />
      <div class="vignette"></div>
      <div class="frame"></div>
      <div class="lockup">
        <div class="kicker">the table · the season</div>
        <div class="rule"></div>
        <div class="rule-blush"></div>
        <h1>Gastronomix</h1>
        <p class="tag">a kitchen magazine</p>
        <div class="rule"></div>
        <div class="issue">vol. 01 · from the kitchen</div>
      </div>
    </div>
  </body>
</html>
